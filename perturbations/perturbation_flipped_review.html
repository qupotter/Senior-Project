<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flipped Perturbations — Manual Review</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090c10;--surface:#0f1318;--surface2:#161c23;
  --border:#1a2230;--border2:#243040;
  --text:#dce6f0;--dim:#5a7a99;--dimmer:#2a3d52;
  --yes:#4ade80;--yes-bg:rgba(74,222,128,0.08);
  --no:#f87171;--no-bg:rgba(248,113,113,0.08);
  --para:#60a5fa;--para-bg:rgba(96,165,250,0.1);
  --ctx:#fb923c;--ctx-bg:rgba(251,146,60,0.1);
  --sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}

header{
  position:sticky;top:0;z-index:100;background:var(--bg);
  border-bottom:1px solid var(--border);padding:14px 28px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.logo{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.flabel{font-family:var(--mono);font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.pill{
  font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:2px;
  border:1px solid var(--border2);background:transparent;color:var(--dimmer);
  cursor:pointer;transition:all .1s;text-transform:uppercase;letter-spacing:.04em;
}
.pill:hover{border-color:var(--dim);color:var(--dim)}
.pill.active{border-color:var(--text);color:var(--text);background:rgba(220,230,240,.06)}
.stats{font-family:var(--mono);font-size:11px;color:var(--dimmer)}

main{padding:16px 28px;max-width:1500px;margin:0 auto}

.card{border:1px solid var(--border);border-radius:3px;margin-bottom:7px;overflow:hidden;transition:border-color .1s}
.card:hover{border-color:var(--border2)}

.card-header{
  display:flex;align-items:center;gap:9px;padding:8px 13px;
  background:var(--surface);cursor:pointer;user-select:none;
}
.card-header:hover{background:var(--surface2)}

.idx{font-family:var(--mono);font-size:10px;color:var(--dimmer);min-width:28px}

.type-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;flex-shrink:0}
.type-paraphrase{color:var(--para);background:var(--para-bg);border:1px solid rgba(96,165,250,.3)}
.type-context_injection{color:var(--ctx);background:var(--ctx-bg);border:1px solid rgba(251,146,60,.3)}

.label-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;flex-shrink:0}
.label-1{color:var(--yes);background:var(--yes-bg);border:1px solid rgba(74,222,128,.25)}
.label-0{color:var(--no);background:var(--no-bg);border:1px solid rgba(248,113,113,.25)}

.acc-chip{font-family:var(--mono);font-size:10px;color:var(--dimmer);flex-shrink:0}
.preview{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chevron{font-family:var(--mono);font-size:10px;color:var(--dimmer);flex-shrink:0}

.card-body{display:none}
.card-body.open{display:block}

.comparison{display:grid;grid-template-columns:1fr 1fr}
.col{padding:14px 16px;border-top:1px solid var(--border)}
.col:first-child{border-right:1px solid var(--border)}
.col-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.col-label{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dimmer)}

.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.fname{font-family:var(--mono);font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.fval{font-size:13px;line-height:1.55;color:var(--text)}

.trials-row{
  border-top:1px solid var(--border);padding:10px 16px;
  display:flex;gap:12px;align-items:center;background:var(--surface);flex-wrap:wrap;
}
.tkey{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dimmer);flex-shrink:0}
.trial-dots{display:flex;gap:4px;align-items:center}
.dot{
  width:22px;height:22px;border-radius:2px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:9px;font-weight:500;
}
.dot-correct{background:rgba(74,222,128,.15);color:var(--yes);border:1px solid rgba(74,222,128,.3)}
.dot-wrong{background:rgba(248,113,113,.15);color:var(--no);border:1px solid rgba(248,113,113,.3)}
.temp-label{font-family:var(--mono);font-size:8px;color:var(--dimmer);margin-top:2px;text-align:center}
.dot-wrap{display:flex;flex-direction:column;align-items:center}

.verdict-row{
  border-top:1px solid var(--border);padding:8px 16px;
  display:flex;gap:16px;background:var(--surface2);
}
.vstat{display:flex;gap:6px;align-items:center}
.vkey{font-family:var(--mono);font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.06em}
.vval{font-family:var(--mono);font-size:11px}

.empty{padding:80px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dimmer)}
</style>
</head>

</header>
<main>

const TEMPS = [0.0, 0.1, 0.2, 0.35, 0.5, 0.65, 0.8, 0.95, 1.1, 1.25];
const LABEL = {'1':'Yes — sufficient','0':'No — insufficient'};
let fType='all', fLabel='all';

function render() {
  const filtered = data.filter(r =>
    (fType==='all' || r.perturbation_type===fType) &&
    (fLabel==='all' || r.target_label===fLabel)
  );
  document.getElementById('stats').textContent = filtered.length + ' / ' + data.length;
  document.getElementById('empty').style.display = filtered.length===0?'block':'none';
  const container = document.getElementById('cards');
  container.innerHTML = '';

  filtered.forEach((r,i) => {
    const typeClass = 'type-' + r.perturbation_type;
    const labelClass = 'label-' + r.target_label;
    const origAcc = parseFloat(r.original_accuracy_rate).toFixed(2);
    const pertAcc = parseFloat(r.accuracy_rate).toFixed(1);

    const trialKeys = ['trial_1_temp_0.0','trial_2_temp_0.1','trial_3_temp_0.2','trial_4_temp_0.35',
                       'trial_5_temp_0.5','trial_6_temp_0.65','trial_7_temp_0.8','trial_8_temp_0.95',
                       'trial_9_temp_1.1','trial_10_temp_1.25'];
    const dots = trialKeys.map((k,ti) => {
      const correct = parseInt(r[k]) === parseInt(r.target_label);
      const cls = correct ? 'dot-correct' : 'dot-wrong';
      const label = correct ? 'Y' : 'N';
      return `<div class="dot-wrap"><div class="dot ${cls}">${label}</div><div class="temp-label">${TEMPS[ti]}</div></div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header" onclick="toggle(this)">
        <span class="idx">#${i+1}</span>
        <span class="type-badge ${typeClass}">${r.perturbation_type.replace('_',' ')}</span>
        <span class="label-badge ${labelClass}">${r.target_label==='1'?'Yes':'No'}</span>
        <span class="acc-chip">orig ${origAcc} → pert ${pertAcc}</span>
        <span class="preview">${r.original_scenario}</span>
        <span class="chevron">▸</span>
      </div>
      <div class="card-body">
        <div class="comparison">
          <div class="col">
            <div class="col-head">
              <span class="col-label">Original</span>
              <span class="label-badge ${labelClass}">${LABEL[r.target_label]}</span>
            </div>
            <div class="field"><div class="fname">Scenario</div><div class="fval">${r.original_scenario}</div></div>
            <div class="field"><div class="fname">Excuse</div><div class="fval">${r.original_excuse}</div></div>
          </div>
          <div class="col">
            <div class="col-head">
              <span class="col-label">Perturbed</span>
              <span class="label-badge ${labelClass}">${LABEL[r.target_label]} <span style="opacity:.5">(expected)</span></span>
            </div>
            <div class="field"><div class="fname">Scenario</div><div class="fval">${r.perturbed_scenario}</div></div>
            <div class="field"><div class="fname">Excuse</div><div class="fval">${r.perturbed_excuse}</div></div>
          </div>
        </div>
        <div class="trials-row">
          <span class="tkey">Trials</span>
          <div class="trial-dots">${dots}</div>
        </div>
        <div class="verdict-row">
          <div class="vstat"><span class="vkey">Correct count</span><span class="vval">${r.correct_count}/10</span></div>
          <div class="vstat"><span class="vkey">Majority pred</span><span class="vval">${r.majority_pred_text}</span></div>
          <div class="vstat"><span class="vkey">Mean pred yes</span><span class="vval">${parseFloat(r.mean_pred_yes).toFixed(2)}</span></div>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function toggle(h) {
  const b=h.nextElementSibling, ic=h.querySelector('.chevron');
  b.classList.toggle('open');
  ic.textContent=b.classList.contains('open')?'▾':'▸';
}

document.querySelectorAll('.pill').forEach(btn => {
  btn.addEventListener('click', () => {
    const f=btn.dataset.filter, v=btn.dataset.val;
    if(f==='type') fType=v; else fLabel=v;
    document.querySelectorAll(`.pill[data-filter="${f}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

render();
</script>
