<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aligned Counterfactuals — 412 pairs</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090c10;--surface:#0f1318;--surface2:#161c23;
  --border:#1a2230;--border2:#243040;
  --text:#dce6f0;--dim:#5a7a99;--dimmer:#2a3d52;
  --yes:#4ade80;--yes-bg:rgba(74,222,128,0.08);
  --no:#f87171;--no-bg:rgba(248,113,113,0.08);
  --swap:#fbbf24;
  --sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}

header{
  position:sticky;top:0;z-index:100;
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.logo{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.filter-group{display:flex;gap:4px;align-items:center}
.flabel{font-family:var(--mono);font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.pill{
  font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:2px;
  border:1px solid var(--border2);background:transparent;color:var(--dimmer);
  cursor:pointer;transition:all .1s;text-transform:uppercase;letter-spacing:.04em;
}
.pill:hover{border-color:var(--dim);color:var(--dim)}
.pill.active{border-color:var(--text);color:var(--text);background:rgba(220,230,240,.06)}
.stats{font-family:var(--mono);font-size:11px;color:var(--dimmer);white-space:nowrap}

main{padding:16px 28px;max-width:1500px;margin:0 auto}

.card{border:1px solid var(--border);border-radius:3px;margin-bottom:7px;overflow:hidden;transition:border-color .1s}
.card:hover{border-color:var(--border2)}

.card-header{
  display:flex;align-items:center;gap:9px;padding:8px 13px;
  background:var(--surface);cursor:pointer;user-select:none;
}
.card-header:hover{background:var(--surface2)}

.idx{font-family:var(--mono);font-size:10px;color:var(--dimmer);min-width:30px}

.fbadge{
  font-family:var(--mono);font-size:10px;padding:2px 7px;
  border-radius:2px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;flex-shrink:0;
}
.f-prior-completion{color:#a78bfa;background:rgba(167,139,250,0.12);border:1px solid #a78bfa44;}
.f-physical-impossibility{color:#f472b6;background:rgba(244,114,182,0.12);border:1px solid #f472b644;}
.f-delegation{color:#34d399;background:rgba(52,211,153,0.12);border:1px solid #34d39944;}
.f-role-obligation{color:#fb923c;background:rgba(251,146,60,0.12);border:1px solid #fb923c44;}
.f-consent{color:#60a5fa;background:rgba(96,165,250,0.12);border:1px solid #60a5fa44;}
.f-harm{color:#f87171;background:rgba(248,113,113,0.12);border:1px solid #f8717144;}
.f-intention{color:#facc15;background:rgba(250,204,21,0.12);border:1px solid #facc1544;}
.f-resource-availability{color:#4ade80;background:rgba(74,222,128,0.12);border:1px solid #4ade8044;}
.f-temporal-conflict{color:#38bdf8;background:rgba(56,189,248,0.12);border:1px solid #38bdf844;}
.f-redundancy{color:#c084fc;background:rgba(192,132,252,0.12);border:1px solid #c084fc44;}


.dir-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;flex-shrink:0}
.dir-10{color:var(--yes);background:var(--yes-bg);border:1px solid rgba(74,222,128,.25)}
.dir-01{color:var(--no);background:var(--no-bg);border:1px solid rgba(248,113,113,.25)}

.swap-chip{
  font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;
  color:var(--swap);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);
  flex-shrink:0;
}

.preview{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tok{font-family:var(--mono);font-size:10px;color:var(--dimmer);flex-shrink:0}
.chevron{font-family:var(--mono);font-size:10px;color:var(--dimmer);flex-shrink:0}

.card-body{display:none}
.card-body.open{display:block}

.comparison{display:grid;grid-template-columns:1fr 1fr}
.col{padding:14px 16px;border-top:1px solid var(--border)}
.col:first-child{border-right:1px solid var(--border)}

.col-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.col-label{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dimmer)}
.lchip{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px;font-weight:500}
.lchip-1{color:var(--yes);background:var(--yes-bg);border:1px solid rgba(74,222,128,.2)}
.lchip-0{color:var(--no);background:var(--no-bg);border:1px solid rgba(248,113,113,.2)}

.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.fname{font-family:var(--mono);font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.fval{font-size:13px;line-height:1.55;color:var(--text)}
.fval .hl{color:var(--swap);font-weight:600;text-decoration:underline;text-decoration-color:rgba(251,191,36,.4)}

.swap-row{
  border-top:1px solid var(--border);padding:10px 16px;
  display:flex;gap:10px;background:var(--surface);align-items:flex-start;
}
.skey{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dimmer);flex-shrink:0;margin-top:2px;min-width:70px}
.sval{font-size:12px;color:var(--dim);line-height:1.5}

.empty{padding:80px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dimmer)}
</style>
</head>

</header>
<main>

  const filtered = data.filter(r => {
    const dir = r.original_label + '-' + r.counterfactual_label;
    return (fDir==='all' || dir===fDir) && (fFactor==='all' || r.swapped_factor===fFactor);
  });
  document.getElementById('stats').textContent = filtered.length + ' / ' + data.length;
  document.getElementById('empty').style.display = filtered.length===0?'block':'none';
  const container = document.getElementById('cards');
  container.innerHTML='';
  filtered.forEach((r,i) => {
    const dir = r.original_label+'-'+r.counterfactual_label;
    const dirClass = r.original_label==='1'?'dir-10':'dir-01';
    const dirLabel = r.original_label==='1'?'Yes → No':'No → Yes';
    const fc = 'f-'+r.swapped_factor.replace(/_/g,'-');
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="card-header" onclick="toggle(this)">
        <span class="idx">#${i+1}</span>
        <span class="fbadge ${fc}">${r.swapped_factor.replace(/_/g,' ')}</span>
        <span class="dir-badge ${dirClass}">${dirLabel}</span>
        <span class="swap-chip">${r.swapped_phrase} → ${r.replacement_phrase}</span>
        <span class="preview">${r.original_scenario}</span>
        <span class="tok">${r.n_tokens_original}t</span>
        <span class="chevron">▸</span>
      </div>
      <div class="card-body">
        <div class="comparison">
          <div class="col">
            <div class="col-head">
              <span class="col-label">Original</span>
              <span class="lchip lchip-${r.original_label}">${LABEL[r.original_label]}</span>
            </div>
            <div class="field">
              <div class="fname">Scenario</div>
              <div class="fval">${r.original_scenario}</div>
            </div>
            <div class="field">
              <div class="fname">Excuse</div>
              <div class="fval">${highlight(r.original_excuse, r.swapped_phrase)}</div>
            </div>
          </div>
          <div class="col">
            <div class="col-head">
              <span class="col-label">Counterfactual</span>
              <span class="lchip lchip-${r.counterfactual_label}">${LABEL[r.counterfactual_label]}</span>
            </div>
            <div class="field">
              <div class="fname">Scenario</div>
              <div class="fval">${r.original_scenario}</div>
            </div>
            <div class="field">
              <div class="fname">Excuse</div>
              <div class="fval">${highlight(r.counterfactual_excuse, r.replacement_phrase)}</div>
            </div>
          </div>
        </div>
        <div class="swap-row">
          <span class="skey">Swap</span>
          <span class="sval">${r.swap_explanation}</span>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function toggle(h) {
  const b=h.nextElementSibling, ic=h.querySelector('.chevron');
  const open=b.classList.toggle('open');
  ic.textContent=open?'▾':'▸';
}

document.querySelectorAll('.pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f=btn.dataset.filter, v=btn.dataset.val;
    if(f==='dir') fDir=v; else fFactor=v;
    document.querySelectorAll(`.pill[data-filter="${f}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

render();
</script>
</body>
</html>
